syntax = "proto3";

package triangel;


//services
service AuthService {
  rpc Login(LoginRequest) returns (LoginReply);
}

service DocumentConfigService {
  rpc GetDocumentConfig(DocumentConfigRequest) returns (DocumentConfigReply);
}

service DocumentsService {
  rpc GetDocuments(DocumentsRequest) returns (DocumentsReply);
}

service DocumentService {
  rpc GetDocument(DocumentRequest) returns (DocumentReply);
}

service DeleteDocumentService {
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentReply);
}

service SendDocumentService {
  rpc SendDocument(SendDocumentRequest) returns (SendDocumentReply);
}

service TaetigkeitService {
  rpc Taetigkeit(TaetigkeitRequest) returns (TaetigkeitReply);
}

service ZeiteintraegeService {
  rpc Zeiteintraege(ZeiteintraegeRequest) returns (ZeiteintraegeReply);
}

service ZeiteintragService {
  rpc Zeiteintrag(ZeiteintragRequest) returns (ZeiteintragReply);
}

service PasswordChangeService {
  rpc PasswordChange(PasswordChangeRequest) returns (PasswordChangeReply);
}

service CreateUserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserReply);
}

service GetUsersService {
  rpc GetUsers(GetUsersRequest) returns (GetUsersReply);
}

service GetRolesService {
  rpc GetRoles(GetRolesRequest) returns (GetRolesReply);
}

service ChangeUserService {
  rpc ChangeUser(ChangeUserRequest) returns (ChangeUserReply);
}

service GetRechteKategorienService {
  rpc GetRechteKategorien(GetRechteKategorienRequest) returns (GetRechteKategorienReply);
}

service GetRechteGruppeService {
  rpc GetRechteGruppe(GetRechteGruppeRequest) returns (GetRechteGruppeReply);
}

service SetRechteService {
  rpc SetRechte(SetRechteRequest) returns (SetRechteReply);
}

service ChangeKategorieService {
  rpc ChangeKategorie(ChangeKategorieRequest) returns (ChangeKategorieReply);
}

service ChangeGruppeService {
  rpc ChangeGruppe(ChangeGruppeRequest) returns (ChangeGruppeReply);
}

service DeleteKategorieService {
  rpc DeleteKategorie(DeleteKategorieRequest) returns (DeleteKategorieReply);
}

service DeleteGruppeService {
  rpc DeleteGruppe(DeleteGruppeRequest) returns (DeleteGruppeReply);
}

service SetNewKategorieService {
  rpc SetNewKategorie(SetNewKategorieRequest) returns (SetNewKategorieReply);
}

service SetNewGruppeService {
  rpc SetNewGruppe(SetNewGruppeRequest) returns (SetNewGruppeReply);
}

service ChangeTaetigkeitService {
  rpc ChangeTaetigkeit(ChangeTaetigkeitRequest) returns (ChangeTaetigkeitReply);
}

service DeleteTaetigkeitService {
  rpc DeleteTaetigkeit(DeleteTaetigkeitRequest) returns (DeleteTaetigkeitReply);
}

service SetNewTaetigkeitService {
  rpc SetNewTaetigkeit(SetNewTaetigkeitRequest) returns (SetNewTaetigkeitReply);
}

service GetBetreuungenService {
  rpc GetBetreuungen(GetBetreuungenRequest) returns (GetBetreuungenReply);
}

service EndBetreuungService {
  rpc EndBetreuung(EndBetreuungRequest) returns (EndBetreuungReply);
}

service SetNewBetreuungService {
  rpc SetNewBetreuung(SetNewBetreuungRequest) returns (SetNewBetreuungReply);
}

service AuswertungBetreuungService {
  rpc AuswertungBetreuung(AuswertungBetreuungRequest) returns (AuswertungReply);
}

service AuswertungBetreuerService {
  rpc AuswertungBetreuer(AuswertungBetreuerRequest) returns (AuswertungReply);
}

service AuswertungKlientService {
  rpc AuswertungKlient(AuswertungKlientRequest) returns (AuswertungReply);
}


//types
message Klient {
  int64 id = 1;
  string fname = 2;
  string nname = 3;
}

message Color {
  int32 r = 1;
  int32 g = 2;
  int32 b = 3;
}

message Uhrzeit {
  int32 hour = 1;
  int32 minute = 2;
}

message Datum {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
}

message Zeiteintrag {
  Datum dayofentry = 1;
  Uhrzeit anfang = 2;
  Uhrzeit ende = 3;
  int64 taetigkeitid = 4;
  int64 klientid = 5;
  string beschreibung = 6;
  int64 eintragid = 7;
}

message Dokument {
  string name = 1;
  IdObjekt Gruppe = 2;
  repeated IdObjekt Kategorie = 3;
  string author = 4;
  int64 klient = 5;
}

message IdObjekt {
  int64 id = 1;
  string bezeichnung = 2;
}

message UserObjekt {
  int64 id = 1;
  string loginName = 2;
  string email = 3;
  string fname = 4;
  string lname = 5;
  int32 role = 6;
}

message IdPair {
  int64 idFirst = 1;
  int64 idSecond = 2;
}

message Taetigkeit {
  int64 id = 1;
  string bezeichnung = 2;
  bool abrechenbar = 3;
  bool buchbar = 4;
}

message Betreuung {
  int64 id = 1;
  int64 klientId = 2;
  int64 betreuerId = 3;
  Datum gueltigVon = 4;
  Datum gueltigBis = 5;
  int64 wochenstunden = 6;
  int64 stundensatz = 7;
}

message Auswertung {
  Datum dayofentry = 1;
  Uhrzeit anfang = 2;
  Uhrzeit ende = 3;
  string taetigkeit = 4;
  string klient = 5;
  string beschreibung = 6;
  string betreuer = 7;
  bool abrechenbar = 8;
}


//messages
message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginReply {
  string error_code = 1;
  string access_token = 2;
  Color darkbg = 3;
  Color lightbg = 4;
  repeated Klient klienten = 5;
  int32 forceResetPass = 6;
  int32 role = 7;
}

message DocumentConfigRequest {

}

message DocumentConfigReply {
  repeated IdObjekt Kategorien = 1;
  repeated IdObjekt Gruppen = 2;
}

message DocumentsRequest {
  int64 klientid = 1;
}

message DocumentsReply {
  repeated Dokument Dokumente = 1;
}

message DocumentRequest {
  Dokument dokument = 1;
}

message DocumentReply {
  bytes file = 1;
}

message DeleteDocumentRequest {
  Dokument dokument = 1;
}

message DeleteDocumentReply {
  
}

message SendDocumentRequest {
  Dokument dokument = 1;
  bytes file = 2;
}

message SendDocumentReply {
  string error_code = 1;
}

message TaetigkeitRequest {
}

message TaetigkeitReply {
  repeated Taetigkeit Taetigkeiten = 1;
}

message ZeiteintraegeRequest {
  Datum zeiteintragdatum = 1;
}

message ZeiteintraegeReply {
  repeated Zeiteintrag zeiteintraege = 1;
}

message ZeiteintragRequest {
  Zeiteintrag zeiteintrag = 1;
  int32 operation = 2;
}

message ZeiteintragReply {
  string error_code = 1;
}

message PasswordChangeRequest {
  string oldPassword = 1;
  string newPassword = 2;
}

message PasswordChangeReply {
  string error_code = 1;
}

message CreateUserRequest {
  UserObjekt newUser = 1;
}

message CreateUserReply {
  string error_code = 1;
}

message GetUsersRequest {
}

message GetUsersReply {
  repeated UserObjekt userList = 1;
}

message GetRolesRequest {
}

message GetRolesReply {
  repeated IdObjekt rolesList = 1;
}

message ChangeUserRequest {
  UserObjekt changedUser = 1;
  int32 forceReset = 2;
}

message ChangeUserReply {
  string error_code = 1;
}

message GetRechteKategorienRequest {
}

message GetRechteKategorienReply {
  repeated IdPair rechteKategorien = 1;
}

message GetRechteGruppeRequest {
}

message GetRechteGruppeReply {
  repeated IdPair rechteGruppe = 1;
}

message SetRechteRequest {
  int64 rollenId = 1;
  repeated int64 gruppenId = 2;
  repeated int64 kategorienId = 3;
}

message SetRechteReply {
  string error_code = 1;
}

message ChangeKategorieRequest {
  IdObjekt kategorie = 1;
}

message ChangeKategorieReply {
  string error_code = 1;
}

message ChangeGruppeRequest {
  IdObjekt gruppe = 1;
}

message ChangeGruppeReply {
  string error_code = 1;
}

message DeleteKategorieRequest {
  IdObjekt kategorie = 1;
}

message DeleteKategorieReply {
  string error_code = 1;
}

message DeleteGruppeRequest {
  IdObjekt gruppe = 1;
}

message DeleteGruppeReply {
  string error_code = 1;
}

message SetNewKategorieRequest {
  IdObjekt kategorie = 1;
}

message SetNewKategorieReply {
  string error_code = 1;
}

message SetNewGruppeRequest {
  IdObjekt gruppe = 1;
}

message SetNewGruppeReply {
  string error_code = 1;
}

message ChangeTaetigkeitRequest {
  Taetigkeit taetigkeit = 1;
}

message ChangeTaetigkeitReply {
  string error_code = 1;
}

message DeleteTaetigkeitRequest {
  int64 taetigkeitId = 1;
}

message DeleteTaetigkeitReply {
  string error_code = 1;
}

message SetNewTaetigkeitRequest {
  Taetigkeit taetigkeit = 1;
}

message SetNewTaetigkeitReply {
  string error_code = 1;
}

message GetBetreuungenRequest {
}

message GetBetreuungenReply {
  repeated Betreuung betreuungen = 1;
}

message EndBetreuungRequest {
  int64 betreuungId = 1;
}

message EndBetreuungReply {
  string error_code = 1;
}

message SetNewBetreuungRequest {
  Betreuung betreuung = 1;
}

message SetNewBetreuungReply {
  string error_code = 1;
}

message AuswertungBetreuungRequest {
  int64 betreuung = 1;
  Datum monat = 2;
  bool abrechenbar = 3;
}

message AuswertungBetreuerRequest {
  int64 betreuer = 1;
  Datum monat = 2;
  bool abrechenbar = 3;
}

message AuswertungKlientRequest {
  int64 klient = 1;
  Datum monat = 2;
  bool abrechenbar = 3;
}

message AuswertungReply {
  repeated Auswertung auswertung = 1;
}
